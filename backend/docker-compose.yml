services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: eventforge
      POSTGRES_PASSWORD: eventforge
      POSTGRES_DB: eventforge
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventforge -d eventforge"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata: